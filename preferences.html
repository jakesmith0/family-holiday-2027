<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Holiday taste quick pass</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2723;--muted:#6d746f;--line:#dedbd2;--accent:#315c4a;--soft:#e9efe9;--warm:#f3e8dc}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh}.shell{max-width:620px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);display:flex;flex-direction:column}
.top{padding:16px 2px 8px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800}.count{font-size:.86rem;color:var(--muted)}
.bar{height:6px;background:#e3e0d8;border-radius:999px;overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0 22px}.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800;margin-bottom:6px}
h1{font-size:clamp(1.8rem,7vw,2.55rem);line-height:1.08;margin:0 0 9px}.help{color:var(--muted);margin:0 0 20px;font-size:1rem}.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;border:1px solid var(--line);border-radius:15px;background:var(--card);padding:15px 16px;font:inherit;font-weight:700;color:var(--ink);min-height:58px;box-shadow:0 3px 14px rgba(30,40,34,.035)}
.choice small{display:block;font-weight:500;color:var(--muted);margin-top:3px}.choice.selected{background:var(--soft);border:2px solid var(--accent);padding:14px 15px}.noteToggle{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:16px 2px 8px;text-align:left}
textarea{display:none;width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit;background:#fff;color:var(--ink)}textarea.show{display:block}
.nav{display:flex;gap:10px;padding:8px 0 max(14px,env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%,var(--bg))}.nav button{border:0;border-radius:14px;min-height:54px;font:inherit;font-weight:800}.back{width:74px;background:#e8e5dd;color:var(--ink)}.next{flex:1;background:var(--accent);color:white}.skip{border:0;background:none;color:var(--muted);font:inherit;padding:10px}
.result{display:none}.result.show{display:block}.summary{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;font-size:.9rem;max-height:38vh;overflow:auto}.resultBtns{display:grid;gap:10px;margin-top:14px}.resultBtns button{min-height:56px;border:0;border-radius:14px;font:inherit;font-weight:800}.share{background:var(--accent);color:#fff}.secondary{background:#e8e5dd;color:var(--ink)}
@media(min-width:700px){.shell{padding-left:24px;padding-right:24px}.stage{padding-top:30px}}
</style></head><body><main class="shell"><div class="top"><div class="topline"><span class="brand">Family holiday 2027</span><span class="count" id="count"></span></div><div class="bar"><i id="progress"></i></div></div><section class="stage" id="stage"></section><div class="nav" id="nav"><button class="back" id="back">Back</button><button class="next" id="next">Next</button></div></main><script>
const Q=[
{id:'who',q:'Who’s doing this quick pass?',help:'Doing separate Jake and Em passes is useful — no need to agree first.',one:true,opts:['Jake','Em','Together','Someone else']},
{id:'holidaylook',q:'What most makes a house feel like a holiday?',help:'Pick as many as genuinely appeal.',opts:['Old stone / cottage / farmhouse','Converted barn / estate building','Big coastal or village house','Distinctive modern house in a great setting','Historic / Georgian / Victorian character','No particular architectural type']},
{id:'familiar',q:'How much should we avoid the “nice normal house on Rightmove” feeling?',help:'This is about familiarity, not a ban on residential locations.',one:true,opts:['Strongly avoid it','Usually a negative','Fine if the setting is special','Doesn’t bother me much']},
{id:'setting',q:'Which settings make you want to go away?',help:'Pick up to three — gut reaction, not a checklist.',max:3,opts:['Sea / coast','Pretty village','Countryside / big views','Harbour / seafront','Historic market town','Estate / farm / parkland','Woodland / lake / river']},
{id:'walk',q:'How much does having something good on foot matter?',help:'Think pub, café, beach, village, promenade — somewhere you can just wander to.',one:true,opts:['Very important','Strong preference','Nice bonus','Not important if the place is great']},
{id:'walkto',q:'What would you most like within walking distance?',help:'Pick anything that would genuinely improve the week.',opts:['A genuinely good pub','Café / bakery / coffee','Beach / promenade / harbour','Village or town centre','Playground / easy child wander','Nice walk straight from the door']},
{id:'space',q:'What kind of shared space sounds best?',help:'This is about six adults + two little children actually living there.',one:true,opts:['One huge kitchen / dining / living hub','Several generous rooms to spread out','Big main hub + a second snug/lounge','Cosier is fine if it has character']},
{id:'scale',q:'How appealing is “big house energy”?',help:'Generous rooms, big table, breathing room, somewhere that feels substantial.',one:true,opts:['Very appealing','Quite appealing','Nice but not important','I prefer cosy / intimate']},
{id:'tradeoff',q:'If you have to trade one against the other…',help:'Which way do you naturally lean?',one:true,opts:['Amazing setting can rescue an ordinary house','Slight lean toward setting','House and setting need equal weight','Slight lean toward the house','Amazing house can rescue a weaker location']},
{id:'interior',q:'What kind of interior gets you excited?',help:'Not “luxury” for the sake of it — just the vibe.',one:true,opts:['Characterful / individual / old-building charm','Polished and stylish, but not generic','Warm, comfortable and spacious is enough','Interior style matters much less than setting']},
{id:'facilities',q:'Which extras can actually sway you?',help:'These are bonuses, not requirements. Cinema is deliberately not here.',opts:['Indoor pool','Hot tub','Pool table / games room','Play equipment / child stuff','None — house + setting matter more']},
{id:'spend',q:'When is paying more actually worth it?',help:'We know ~£1k is attractive, ~£1.5k is the sweet spot and £2k is basically the ceiling.',one:true,opts:['I’d happily add ~£300–£500 for real atmosphere / setting','Maybe ~£200–£300 if the difference is obvious','Prefer to stay near £1k unless exceptional','Price matters more than upgrading the vibe']},
];
let i=0;let A=JSON.parse(localStorage.getItem('holidayTasteAnswers')||'{}');
const stage=document.getElementById('stage'),nav=document.getElementById('nav'),next=document.getElementById('next'),back=document.getElementById('back');
function save(){localStorage.setItem('holidayTasteAnswers',JSON.stringify(A))}
function selected(q,v){const a=A[q.id]?.values||[];return a.includes(v)}
function render(){const q=Q[i];document.getElementById('count').textContent=`${i+1} / ${Q.length}`;document.getElementById('progress').style.width=`${(i/Q.length)*100}%`;back.style.visibility=i?'visible':'hidden';
const choices=q.opts.map(v=>`<button class="choice ${selected(q,v)?'selected':''}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
stage.innerHTML=`<div class="kicker">Quick taste calibration</div><h1>${esc(q.q)}</h1><p class="help">${esc(q.help||'')}</p><div class="choices">${choices}</div><button class="noteToggle">+ add a quick comment</button><textarea placeholder="Optional — e.g. ‘love old houses but not twee cottages’">${esc(A[q.id]?.note||'')}</textarea><button class="skip">Skip this one</button>`;
stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(q,b));stage.querySelector('.noteToggle').onclick=()=>stage.querySelector('textarea').classList.toggle('show');stage.querySelector('textarea').oninput=e=>{A[q.id]=A[q.id]||{values:[]};A[q.id].note=e.target.value;save()};stage.querySelector('.skip').onclick=goNext;next.textContent=q.one?'Next':'Done / next';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function choose(q,b){A[q.id]=A[q.id]||{values:[],note:''};const v=b.dataset.v;if(q.one){A[q.id].values=[v];save();stage.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));setTimeout(goNext,180);return}let vals=A[q.id].values||[];if(vals.includes(v))vals=vals.filter(x=>x!==v);else{if(q.max&&vals.length>=q.max){b.animate([{transform:'scale(1)'},{transform:'scale(.98)'},{transform:'scale(1)'}],{duration:180});return}vals.push(v)}A[q.id].values=vals;save();b.classList.toggle('selected',vals.includes(v))}
function goNext(){if(i<Q.length-1){i++;render()}else finish()}
function goBack(){if(i>0){i--;render()}}
function makeText(){const who=A.who?.values?.[0]||'Unknown';let lines=[`HOLIDAY TASTE CALIBRATION — ${who}`,''];for(const q of Q.slice(1)){const x=A[q.id];if(!x||(!x.values?.length&&!x.note))continue;lines.push(`${q.q}`);if(x.values?.length)lines.push(`→ ${x.values.join(' · ')}`);if(x.note)lines.push(`Note: ${x.note.trim()}`);lines.push('')}return lines.join('\n').trim()}
function finish(){document.getElementById('count').textContent='Done';document.getElementById('progress').style.width='100%';nav.style.display='none';const txt=makeText();stage.innerHTML=`<div class="result show"><div class="kicker">Done</div><h1>That’s enough to steer the search.</h1><p class="help">No scores to interpret. Just send this back to Jake / ChatGPT and I can use the actual pattern of preferences.</p><div class="summary" id="summary"></div><div class="resultBtns"><button class="share" id="share">Share answers</button><button class="secondary" id="copy">Copy answers</button><button class="secondary" id="edit">Go back and edit</button><button class="secondary" id="reset">Start a fresh pass</button></div></div>`;document.getElementById('summary').textContent=txt;document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Holiday taste calibration',text:txt})}catch(e){}}else copy(txt)};document.getElementById('copy').onclick=()=>copy(txt);document.getElementById('edit').onclick=()=>{nav.style.display='flex';i=Q.length-1;render()};document.getElementById('reset').onclick=()=>{if(confirm('Clear these answers and start again?')){A={};save();nav.style.display='flex';i=0;render()}}}
async function copy(t){await navigator.clipboard.writeText(t);const b=document.getElementById('copy');if(b){const old=b.textContent;b.textContent='Copied ✓';setTimeout(()=>b.textContent=old,1200)}}
next.onclick=goNext;back.onclick=goBack;render();
</script></body></html>
